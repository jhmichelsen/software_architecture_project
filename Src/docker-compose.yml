services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"     # RabbitMQ broker port
      - "15672:15672"   # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - greenhouse-net

  greenhousefactoryui:
    build:
      context: ./GreenHouseFactoryUI/GreenHouseFactoryUI
      dockerfile: Dockerfile
    container_name: greenhousefactoryui
    depends_on:
      - greenhousefactoryservice
    networks:
      - greenhouse-net
    ports:
      - "5001:8080"

  greenhousefactoryservice:
    build:
      context: ./GreenhouseFactoryService/GreenhouseFactoryService
      dockerfile: Dockerfile
    container_name: greenhousefactoryservice
    depends_on:
      - rabbitmq
    networks:
      - greenhouse-net
    ports:
      - "5002:8080"

  simulatorui:
    build:
      context: ./SimulatorUI
      dockerfile: Dockerfile
    container_name: simulatorui
    depends_on:
      - rabbitmq
    networks:
      - greenhouse-net
    ports:
      - "5003:8080"
    environment:
      - RabbitMq__Host=rabbitmq
      - RabbitMq__Port=5672

  soilmoistureservice:
    build:
      context: ./SoilMoistureService
      dockerfile: Dockerfile
    container_name: soilmoistureservice
    depends_on:
      - rabbitmq
    networks:
      - greenhouse-net
    ports:
      - "5004:8080"
    environment:
      - RabbitMq__Host=rabbitmq
      - RabbitMq__Port=5672

  waterservice:
    build:
      context: ./WaterService/WaterService
      dockerfile: Dockerfile
    container_name: waterservice
    depends_on:
      - rabbitmq
    networks:
      - greenhouse-net
    ports:
      - "5005:8080"
    environment:
      - RabbitMq__Host=rabbitmq
      - RabbitMq__Port=5672

networks:
  greenhouse-net:
    driver: bridge
