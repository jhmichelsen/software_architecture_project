apiVersion: apps/v1
kind: Deployment
metadata:
  name: greenhousefactoryservice
spec:
  replicas: 2
  selector:
    matchLabels:
      app: greenhousefactoryservice
  template:
    metadata:
      labels:
        app: greenhousefactoryservice
    spec:
      containers:
      - name: greenhousefactoryservice
        image: greenhousefactoryservice:latest
        ports:
        - containerPort: 8080
        env:
        - name: RabbitMq__Host
          value: "rabbitmq"
        - name: RabbitMq__Port
          value: "5672"
---
apiVersion: v1
kind: Service
metadata:
  name: greenhousefactoryservice
spec:
  selector:
    app: greenhousefactoryservice
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
