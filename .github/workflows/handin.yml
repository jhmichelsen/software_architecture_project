name: Handin workflow

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'report/GroupTemplate/**'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'report/GroupTemplate/**'

env:
  DOCKER_IMAGE_NAME: lowercase-image-name
  PROJECT_NAME: ProjectName
  GROUP_NUMBER: GroupNumber

jobs:

  # Create artifact of repository source code
  clone-repository:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Upload Repository artifacts
        uses: actions/upload-artifact@v4
        with:
          name: repository-artifacts
          path: .

  # Code analysis (linting / static analysis)
  code-analysis:
    runs-on: ubuntu-latest
    needs: clone-repository
    steps:
      - name: Download source
        uses: actions/download-artifact@v4
        with:
          name: repository-artifacts
          path: .

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Run dotnet format (code style check)
        run: dotnet format --verify-no-changes || true

  # Build application
  build:
    runs-on: ubuntu-latest
    needs: code-analysis
    steps:
      - name: Download source
        uses: actions/download-artifact@v4
        with:
          name: repository-artifacts
          path: .

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: |
          find Src -name "*.csproj" -exec dotnet restore {} \;

      - name: Build application
        run: |
          find Src -name "*.csproj" -exec dotnet build {} --configuration Release --no-restore \;

      - name: Upload compiled app as artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-app
          path: Src

  # Test application
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download compiled app
        uses: actions/download-artifact@v4
        with:
          name: compiled-app
          path: Src

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Run tests (placeholder)
        run: echo "No tests added yet. Add dotnet test steps here later."

  # Compile LaTeX group report
  compile-latex-groupReport:
    runs-on: ubuntu-latest
    needs: clone-repository
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache LaTeX packages
        id: latex-cache
        uses: actions/cache@v4
        with:
          path: |
            /usr/share/texlive/
          key: ${{ runner.os }}-texlive-v4

      - name: Install LaTeX packages
        if: steps.latex-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive texlive-science texlive-xetex

      - name: Create handin folder
        run: mkdir handin/

      - name: Compile LaTeX document
        run: |
          cd report/GroupTemplate
          xelatex -synctex=1 -interaction=nonstopmode main.tex

      - name: Rename compiled PDF
        run: |
          mv report/GroupTemplate/main.pdf handin/report${{ env.GROUP_NUMBER }}.pdf

      - name: Upload GroupReport-pdf artifact
        uses: actions/upload-artifact@v4
        with:
          name: GroupReport-pdf
          path: handin/

  # Create final handin artifact
  upload-handin-artifacts:
    runs-on: ubuntu-latest
    needs: [build, compile-latex-groupReport]
    steps:
      - name: Download repository artifact
        uses: actions/download-artifact@v4
        with:
          name: repository-artifacts
          path: .

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: compiled-app
          path: ./build

      - name: Download GroupReport
        uses: actions/download-artifact@v4
        with:
          name: GroupReport-pdf
          path: ./handin

      - name: Upload handin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: handin-${{ env.PROJECT_NAME }}-${{ env.GROUP_NUMBER }}
          path: .
