name: Hand-in Workflow

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:

  # ---------------------------------------------------------
  # Clone repository (creates source artifact)
  # ---------------------------------------------------------
  clone-repository:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload source as artifact
        uses: actions/upload-artifact@v4
        with:
          name: source-code
          path: .

  # ---------------------------------------------------------
  # Code analysis
  # ---------------------------------------------------------
  code-analysis:
    runs-on: ubuntu-latest
    needs: clone-repository
    steps:
      - name: Download source
        uses: actions/download-artifact@v4
        with:
          name: source-code
          path: .

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Run code analysis (dotnet format)
        run: dotnet format --verify-no-changes || true

  # ---------------------------------------------------------
  # Build application
  # ---------------------------------------------------------
  build-application:
    runs-on: ubuntu-latest
    needs: code-analysis

    steps:
      - name: Download source
        uses: actions/download-artifact@v4
        with:
          name: source-code
          path: .

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: |
          find Src -name "*.csproj" -exec dotnet restore {} \;

      - name: Build application
        run: |
          find Src -name "*.csproj" -exec dotnet build {} --configuration Release --no-restore \;

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: Src

  # ---------------------------------------------------------
  # Test application
  # ---------------------------------------------------------
  test-application:
    runs-on: ubuntu-latest
    needs: build-application

    steps:
      - name: Download compiled app
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: Src

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Run tests
        run: echo "No tests added yet. Add dotnet test here later."

  # ---------------------------------------------------------
  # Compile LaTeX group report
  # ---------------------------------------------------------
  compile-latex-groupReport:
    runs-on: ubuntu-latest
    needs: clone-repository

    steps:
      - name: Download source
        uses: actions/download-artifact@v4
        with:
          name: source-code
          path: .

      - name: Install LaTeX
        run: sudo apt-get update && sudo apt-get install -y texlive-full

      - name: Compile LaTeX Group Report
        run: |
          cd Report/GroupTemplate
          latexmk -pdf -interaction=nonstopmode MY_LATEX_FILE.tex

      - name: Upload PDF report artifact
        uses: actions/upload-artifact@v4
        with:
          name: group-report
          path: Report/GroupTemplate/MY_LATEX_FILE.pdf

  # ---------------------------------------------------------
  # Create final hand-in package ZIP
  # ---------------------------------------------------------
  upload-handin-artifacts:
    runs-on: ubuntu-latest
    needs:
      - test-application
      - compile-latex-groupReport

    steps:
      - name: Download source code
        uses: actions/download-artifact@v4
        with:
          name: source-code
          path: handin/source

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: handin/build

      - name: Download group report
        uses: actions/download-artifact@v4
        with:
          name: group-report
          path: handin/report

      - name: Create hand-in ZIP package
        run: |
          cd handin
          zip -r handin-package.zip .

      - name: Upload final hand-in ZIP
        uses: actions/upload-artifact@v4
        with:
          name: final-handin
          path: handin/handin-package.zip
