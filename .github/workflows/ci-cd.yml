name: CI/CD Workflow

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to run the workflow on"
        required: true
        default: "main"

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.ref_name }}-${{ github.sha }}

jobs:
  # Clone repository and create artifact
  clone-repository:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || 'main' }}

      - name: Upload source as artifact
        uses: actions/upload-artifact@v4
        with:
          name: source-code
          path: .

  # Code analysis (linting / static analysis)
  code-analysis:
    runs-on: ubuntu-latest
    needs: clone-repository
    steps:
      - name: Download source
        uses: actions/download-artifact@v4
        with:
          name: source-code
          path: .

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Run dotnet format (code style check)
        run: dotnet format --verify-no-changes || true

  # Build application
  build:
    runs-on: ubuntu-latest
    needs: code-analysis
    steps:
      - name: Download source
        uses: actions/download-artifact@v4
        with:
          name: source-code
          path: .

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: |
          find Src -name "*.csproj" -exec dotnet restore {} \;

      - name: Build application
        run: |
          find Src -name "*.csproj" -exec dotnet build {} --configuration Release --no-restore \;

      - name: Upload compiled app as artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-app
          path: Src

  # Test application (placeholder for future tests)
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download compiled app
        uses: actions/download-artifact@v4
        with:
          name: compiled-app
          path: Src

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Run tests (placeholder)
        run: echo "No tests added yet. Add dotnet test steps here later."

  # Build and push Docker images
  docker:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository for Docker
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || 'main' }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker images
        run: |
          # Define image list
          SERVICES=("GreenhouseFactoryService" "SoilMoistureService" "WaterService" "SimulatorUI" "Dashboard")

          for SERVICE in "${SERVICES[@]}"; do
            IMAGE_BASE="${{ env.REGISTRY }}/${{ github.repository_owner }}/${SERVICE,,}"
            COMMIT_TAG="${{ github.ref_name }}-${{ github.sha }}"
            echo "Building and pushing $SERVICE as:"
            echo "  $IMAGE_BASE:$COMMIT_TAG"
            echo "  $IMAGE_BASE:latest"

            docker build -t "$IMAGE_BASE:$COMMIT_TAG" -t "$IMAGE_BASE:latest" -f "Src/$SERVICE/Dockerfile" "Src/$SERVICE"
            docker push "$IMAGE_BASE:$COMMIT_TAG"
            docker push "$IMAGE_BASE:latest"
          done

  # Deploy (placeholder)
  deploy:
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - name: Example deploy step
        run: |
          echo "Deployment step placeholder."
          echo "For example, deploy all services to a VM like this:"
          echo "ssh user@your-server 'docker pull ghcr.io/your-username/greenhousefactoryservice:${{ github.ref_name }}-${{ github.sha }} && docker-compose up -d'"
          echo "Repeat for other services, or use a CI/CD deployment tool."
